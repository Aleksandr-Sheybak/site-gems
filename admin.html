<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Администрирование — Самоцветы</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ru.js"></script>
    <style>
        :root {
            --purple: #7c3aed;
            --purple-light: #a78bfa;
            --darkblue: #1e293b;
            --lightblue: #38bdf8;
            --emerald: #10b981;
            --font: 'Inter', system-ui, Arial, sans-serif;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #334155;
            --border: #e2e8f0;
            --shadow: 0 8px 30px rgba(0,0,0,0.06);
            --radius: 24px;
        }
        body.dark {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #cbd5e1;
            --border: #334155;
            background: #0f172a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            transition: background 0.3s, color 0.3s;
        }
        .container {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 40px;
            width: 100%;
            max-width: 500px;
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h2 {
            margin-bottom: 24px;
            color: var(--darkblue);
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        input, textarea {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: var(--bg);
            color: var(--text);
            font-size: 16px;
            transition: 0.2s;
            font-family: var(--font);
        }
        input:focus, textarea:focus {
            border-color: var(--purple);
            outline: none;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2);
        }
        button {
            width: 100%;
            padding: 14px;
            background: var(--purple);
            color: white;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
        }
        button:hover { background: var(--purple-light); }
        .error {
            color: #f43f5e;
            margin-top: 12px;
            text-align: center;
        }
        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 20px;
            color: var(--text);
            cursor: pointer;
        }
        .logout-btn, .back-btn {
            background: #94a3b8;
            color: white;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            border-radius: 14px;
            font-weight: 500;
            transition: 0.2s;
        }
        .back-btn { margin-bottom: 20px; }
        .logout-btn:hover, .back-btn:hover { background: #64748b; }
        .admin-panel {
            max-width: 900px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        th { color: var(--purple); font-weight: 600; }
        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 30px;
            width: 90%;
            max-width: 600px;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
            border: 1px solid var(--border);
        }
        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #94a3b8;
        }
        .modal-close:hover { color: var(--darkblue); }
        .emoji-picker {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 10px 0;
        }
        .emoji-btn {
            font-size: 20px;
            background: none;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 4px 8px;
            cursor: pointer;
        }
        .image-preview {
            max-width: 200px;
            max-height: 200px;
            border-radius: 12px;
            margin-top: 10px;
            display: none;
            border: 1px solid var(--border);
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle" title="Переключить тему"><i class="fas fa-moon"></i></button>

    <!-- Форма входа -->
    <div class="container" id="loginBox">
        <h2><i class="fas fa-lock"></i> Вход</h2>
        <input type="text" id="loginUser" placeholder="Логин">
        <input type="password" id="loginPass" placeholder="Пароль">
        <button onclick="login()">Войти</button>
        <div class="error" id="loginError"></div>
        <p style="text-align:center; margin-top:15px;"><a href="index.html" style="color:var(--purple);">← Вернуться на сайт</a></p>
    </div>

    <!-- Панель управления -->
    <div class="container admin-panel" id="adminBox" style="display:none;">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Вернуться на сайт</a>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h2><i class="fas fa-newspaper"></i> Управление новостями</h2>
            <button onclick="logout()" class="logout-btn" style="width:auto;"><i class="fas fa-sign-out-alt"></i> Выйти</button>
        </div>
        <button onclick="openNewsForm()" style="width:auto; margin-bottom:20px;"><i class="fas fa-plus"></i> Новая новость</button>
        <table>
            <thead><tr><th>Заголовок</th><th>Статус</th><th></th></tr></thead>
            <tbody id="adminNewsTable"></tbody>
        </table>
    </div>

    <!-- Редактор новости -->
    <div class="modal" id="editorModal" style="display:none;">
        <div class="modal-content">
            <button class="modal-close" onclick="closeNewsEditor()">&times;</button>
            <h3 id="editorTitle">Новая новость</h3>
            <input type="text" id="newsTitle" placeholder="Заголовок">
            <textarea id="newsContent" rows="4" placeholder="Текст новости"></textarea>
            <label style="display:block; margin-top:15px;">📷 Ссылка на изображение (URL):</label>
            <input type="text" id="newsImageUrl" placeholder="https://example.com/image.jpg" oninput="previewImage()">
            <img id="imagePreview" class="image-preview" alt="Предпросмотр" />
            <div class="emoji-picker" id="emojiPicker"></div>
            <label style="display:block; margin-top:15px;">📅 Дата и время публикации (Екб):</label>
            <input type="text" id="newsPublishDate" placeholder="ГГГГ-ММ-ДД ЧЧ:ММ">
            <button onclick="saveNews()">Сохранить</button>
            <button onclick="closeNewsEditor()" style="background:#cbd5e1; color:#334155;">Отмена</button>
            <div class="error" id="editorError"></div>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbxid7p2qdp7qaCPQ7MevszgHIohE-RuoDvOutmNLhfGgAVKTwptK9Rn4wA38i5fb2Igpw/exec';
        const ADMIN_USER = 'Root';
        const ADMIN_PASS = 'anna1981';

        // Тёмная тема
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = themeToggle.querySelector('i');
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark');
            if (document.body.classList.contains('dark')) {
                localStorage.setItem('theme', 'dark');
                themeIcon.classList.replace('fa-moon', 'fa-sun');
            } else {
                localStorage.setItem('theme', 'light');
                themeIcon.classList.replace('fa-sun', 'fa-moon');
            }
        });

        // Авторизация
        if (sessionStorage.getItem('admin_logged') === 'true') {
            showAdmin();
        }

        function login() {
            const u = document.getElementById('loginUser').value.trim();
            const p = document.getElementById('loginPass').value.trim();
            if (u === ADMIN_USER && p === ADMIN_PASS) {
                sessionStorage.setItem('admin_logged', 'true');
                showAdmin();
            } else {
                document.getElementById('loginError').textContent = 'Неверный логин или пароль';
            }
        }

        function logout() {
            sessionStorage.removeItem('admin_logged');
            location.reload();
        }

        function showAdmin() {
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('adminBox').style.display = 'block';
            loadAdminNews();
        }

        // Загрузка новостей
        async function loadAdminNews() {
            const tbody = document.getElementById('adminNewsTable');
            tbody.innerHTML = '<tr><td colspan="3">Загрузка...</td></tr>';
            try {
                const resp = await fetch(`${API_URL}?action=newsAdmin&user=${ADMIN_USER}&pass=${ADMIN_PASS}`);
                const data = await resp.json();
                if (!data.news) return;
                tbody.innerHTML = data.news.map(n => `
                    <tr>
                        <td>${n.title}</td>
                        <td>${n.status || 'опубликовано'}</td>
                        <td style="display:flex; gap:8px;">
                            <button onclick="editNews('${n.id}')" style="width:auto; padding:6px 10px;"><i class="fas fa-edit"></i></button>
                            <button onclick="deleteNews('${n.id}')" style="width:auto; padding:6px 10px; background:#f43f5e;"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `).join('');
            } catch(e) {}
        }

        let currentEditId = null;
        function openNewsForm() {
            currentEditId = null;
            document.getElementById('editorTitle').textContent = 'Новая новость';
            document.getElementById('newsTitle').value = '';
            document.getElementById('newsContent').value = '';
            document.getElementById('newsImageUrl').value = '';
            document.getElementById('imagePreview').style.display = 'none';
            document.getElementById('newsPublishDate').value = '';
            initEmojiPicker();
            flatpickr("#newsPublishDate", { enableTime: true, dateFormat: "Y-m-d H:i", time_24hr: true, locale: "ru", defaultDate: new Date() });
            document.getElementById('editorModal').style.display = 'flex';
        }

        function editNews(id) {
            fetch(`${API_URL}?action=newsAdmin&user=${ADMIN_USER}&pass=${ADMIN_PASS}`)
                .then(r => r.json())
                .then(data => {
                    const item = data.news.find(n => n.id === id);
                    if (!item) return;
                    currentEditId = id;
                    document.getElementById('editorTitle').textContent = 'Редактирование';
                    document.getElementById('newsTitle').value = item.title;
                    document.getElementById('newsContent').value = item.content;
                    // Заполняем поле ссылки, если есть изображение
                    document.getElementById('newsImageUrl').value = item.images && item.images.length > 0 ? item.images[0] : '';
                    previewImage();
                    document.getElementById('newsPublishDate').value = item.publishDate;
                    initEmojiPicker();
                    flatpickr("#newsPublishDate", { enableTime: true, dateFormat: "Y-m-d H:i", time_24hr: true, locale: "ru", defaultDate: item.publishDate });
                    document.getElementById('editorModal').style.display = 'flex';
                });
        }

        function closeNewsEditor() {
            document.getElementById('editorModal').style.display = 'none';
        }

        function previewImage() {
            const url = document.getElementById('newsImageUrl').value.trim();
            const img = document.getElementById('imagePreview');
            if (url) {
                img.src = url;
                img.style.display = 'block';
            } else {
                img.style.display = 'none';
            }
        }

        function initEmojiPicker() {
            const picker = document.getElementById('emojiPicker');
            const emojis = ['😀','😃','😄','😁','😆','😅','🤣','😂','🙂','😉','😊','😇','🥰','😍','🤩','😘','😗','😚','😋','😛','😜','🤪','😝','🤑','🤗','🤭','🤫','🤔','🤐','🤨','😐','😑','😶','😏','😒','🙄','😬','🤥'];
            picker.innerHTML = emojis.map(e => `<button class="emoji-btn" onclick="document.getElementById('newsContent').value+='${e}'">${e}</button>`).join('');
        }

        async function saveNews() {
            const title = document.getElementById('newsTitle').value.trim();
            const content = document.getElementById('newsContent').value.trim();
            const publishDate = document.getElementById('newsPublishDate').value.trim() || new Date().toISOString();
            const imageUrl = document.getElementById('newsImageUrl').value.trim();

            if (!title || !content) {
                document.getElementById('editorError').textContent = 'Заполните заголовок и текст';
                return;
            }

            const params = new URLSearchParams({
                action: currentEditId ? 'newsUpdate' : 'newsAdd',
                user: ADMIN_USER,
                pass: ADMIN_PASS,
                title,
                content,
                images: imageUrl || '',
                publishDate
            });
            if (currentEditId) params.append('id', currentEditId);

            const resp = await fetch(API_URL + '?' + params.toString());
            const result = await resp.json();
            if (result.success) {
                closeNewsEditor();
                loadAdminNews();
            } else {
                document.getElementById('editorError').textContent = 'Ошибка сохранения';
            }
        }

        async function deleteNews(id) {
            if (!confirm('Удалить новость?')) return;
            await fetch(`${API_URL}?action=newsDelete&user=${ADMIN_USER}&pass=${ADMIN_PASS}&id=${id}`);
            loadAdminNews();
        }
    </script>
</body>
</html>
